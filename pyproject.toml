[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-summary-cli"
version = "0.1.0"
description = "Herramienta CLI para obtener resumenes visuales de perfiles de GitHub."
authors = [{ name = "Valentín Aguayo" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
gh-summary = "gh_summary.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]